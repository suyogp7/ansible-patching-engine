---
- name: Ensure report directory exists on control node
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Generate JSON Patching Audit Report per Host
  ansible.builtin.copy:
    content: |
      {
        "hostname": "{{ inventory_hostname }}",
        "os_family": "{{ ansible_facts['os_family'] }}",
        "distribution": "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}",
        "kernel": "{{ ansible_facts['kernel'] }}",
        "patch_timestamp": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}",
        "reboot_required": "{{ reboot_required | default(false) }}"
      }
    dest: "{{ playbook_dir }}/../reports/audit_{{ inventory_hostname }}.json"
    mode: '0644'
  delegate_to: localhost
  become: false

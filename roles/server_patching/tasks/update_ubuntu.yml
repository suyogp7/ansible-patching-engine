---
- name: Update apt repo cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages on Ubuntu safely
  ansible.builtin.apt:
    name: "*"
    state: latest
  register: ubuntu_upgrade

- name: Check if a reboot is required on Ubuntu
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Notify reboot status
  ansible.builtin.debug:
    msg: "Reboot is REQUIRED on {{ inventory_hostname }}"
  when: reboot_required_file.stat.exists
